# Trecho para bitbucket-pipelines.yml (pull requests) no repositório do seu projeto.

pipelines:
  pull-requests:
    "**":
      - step:
          name: Agente de auditoria de segurança
          image: node:20-slim
          script:
            - apt-get update && apt-get install -y curl git
            - export SECURITY_RUNNER_RAW_URL="${SECURITY_RUNNER_RAW_URL:-https://raw.githubusercontent.com/MateusHoffman/security-audit-agent/main}"
            - curl -fsSL "${SECURITY_RUNNER_RAW_URL}/run_audit.sh" -o run_audit.sh
            - curl -fsSL "${SECURITY_RUNNER_RAW_URL}/prompt.txt" -o prompt.txt
            - chmod +x run_audit.sh
            - export AUDIT_SCOPE="${AUDIT_SCOPE:-pr}"
            - ./run_audit.sh
          artifacts:
            - security-audit-report.md
