# Cole em .github/workflows/security-audit.yml no repositório do seu projeto.

name: Agente de auditoria de segurança

on:
  pull_request:
    branches: [main, master, develop]

jobs:
  security-audit:
    name: Agente de auditoria de segurança
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Executar agente de auditoria
        env:
          SECURITY_RUNNER_RAW_URL: https://raw.githubusercontent.com/MateusHoffman/security-audit-agent/main
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AUDIT_SCOPE: ${{ vars.AUDIT_SCOPE }}
        run: |
          curl -fsSL "${SECURITY_RUNNER_RAW_URL}/run_audit.sh" -o run_audit.sh
          curl -fsSL "${SECURITY_RUNNER_RAW_URL}/prompt.txt" -o prompt.txt
          chmod +x run_audit.sh
          ./run_audit.sh

      - name: Comentar relatório no PR
        if: github.event_name == 'pull_request' && github.event.pull_request.number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: security-audit-report.md
          comment-tag: security-audit-report
