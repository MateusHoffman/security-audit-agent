# Cole em .github/workflows/security-audit.yml no repositório do cliente.
# Ajuste SECURITY_RUNNER_RAW_URL para a URL raw do seu repositório security-runner.

name: Zero-Friction Security Audit (OpenCode)

on:
  pull_request:
    branches: [main, master, develop]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run OpenCode Security Harness
        env:
          SECURITY_RUNNER_RAW_URL: https://raw.githubusercontent.com/SEU_USUARIO/security-runner/main
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          curl -fsSL "${SECURITY_RUNNER_RAW_URL}/run_audit.sh" -o run_audit.sh
          curl -fsSL "${SECURITY_RUNNER_RAW_URL}/prompt.txt" -o prompt.txt
          chmod +x run_audit.sh
          ./run_audit.sh

      - name: Upload Security Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security-audit-report.md
